<!doctype html><html lang="pt-BR"><meta charset="utf-8"><body><div id="game-container"></div><button id="test" style="position:fixed;top:0;z-index:99">Testar trilhas</button><pre id="result" style="position:fixed;top:30px;z-index:99;background:#111;color:white">Pronto</pre><script type="module">
import '/src/main.ts';import {playSound} from '/src/systems/SoundEffects.ts';import {MUSIC,LOCAL_AMBIENCE} from '/src/data/soundscape.ts';import {addAmbientSource} from '/src/systems/Soundscape.ts';
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),out=document.querySelector('#result');const check=(v,m)=>{if(!v)throw Error(m)};
document.querySelector('#test').onclick=async()=>{try{
const game=window.ashenVeil,scene=game.scene.getScene('PrisonScene');check(scene.player,'Aguarde carregar');if(game.sound.context)await game.sound.context.resume();game.sound.unlock();
for(const c of [...Object.values(MUSIC),...Object.values(LOCAL_AMBIENCE)])check(game.cache.audio.exists(c.key),'Cache '+c.key);
await sleep(1700);check(game.sound.get('music-exploration')?.isPlaying,'Exploração');
const view=scene.cameras.main.worldView;let enabled=true;addAmbientSource(scene,'fire',view.centerX,view.centerY,()=>enabled);addAmbientSource(scene,'chains',view.centerX,view.centerY);await sleep(500);check(game.sound.get('local-fire')?.isPlaying,'Fogo');check(game.sound.get('local-chains')?.isPlaying,'Correntes');
game.events.emit('boss:engaged',{name:'Teste',current:100,max:100});await sleep(2300);check(game.sound.get('music-root')?.volume>.08,'Música Raiz');check(game.sound.get('music-exploration')?.volume<.02,'Transição exploração');
scene.scene.pause();await sleep(100);check(game.sound.get('music-root')?.isPaused,'Pausa');game.scene.resume('PrisonScene');await sleep(100);check(game.sound.get('music-root')?.isPlaying,'Retomada');
for(const id of ['arenaClose','arenaOpen','victory']){playSound(scene,id);check(game.sound.get('sfx-'+id)?.isPlaying,id);await sleep(300)}
const old=game.sound.get('music-root');scene.scene.restart({roomId:'prison-boss-lair'});await sleep(1500);check(old!==game.sound.get('music-root'),'Limpeza');game.events.emit('boss:engaged',{name:'Teste',current:100,max:100});await sleep(1700);check(game.sound.get('music-reaper')?.isPlaying,'Música Ceifador');game.events.emit('boss:defeated');await sleep(1700);check(game.sound.get('music-exploration')?.volume>.05,'Exploração após vitória');
out.textContent='PASSOU: trilhas, transição, fogo/correntes, portão, vitória, pausa/retomada e limpeza na troca de sala.';
}catch(e){out.textContent='FALHOU: '+e.message;console.error(e)}};
</script></body></html>
